[package]
name = "fmemos"
version = "0.11.0"
description = "FMemos - flomo 风格的本地卡片笔记"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fmemos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 8GB 内存机器上的求生配置：最低优化 + 拆细代码生成单元，
# 最大限度压低 rustc 编译期内存峰值，避免 OOM 崩溃
[profile.release]
opt-level = 1
codegen-units = 32
strip = true

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLCipher 加密；vendored-openssl 让 openssl-src 从源码编 OpenSSL（需要 perl，见 .cargo/config.toml）
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
base64 = "0.22"
sha2 = "0.10"
# 生成加密密钥用（Windows 走 BCrypt）
getrandom = "0.2"

